name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # to download fonts
          lfs: true

      - name: Build and push image to Scaleway Container Registry
        env:
          SCW_REGISTRY_TOKEN: ${{ secrets.SCW_REGISTRY_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          IMAGE="rg.fr-par.scw.cloud/bergere/web:$SHORT_SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          printf '%s\n' "$SCW_REGISTRY_TOKEN" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          docker logout rg.fr-par.scw.cloud

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Roll out to Kosmos Kubernetes
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "kubectl -n bergere set image deployment/bergere web='${{ env.IMAGE }}' && kubectl -n bergere rollout status deployment/bergere --timeout=180s"
